            data: {
                labels: top10.map(a => (a.account || '').substring(0, 8)),
                datasets: [{ label: '鎬昏鍗?, data: top10.map(a => a.totalOrders || 0), backgroundColor: colors10 }]
            },
            options: { indexAxis: 'y', responsive: true }
        });
        
        // Heatmap (at bottom)
        const colors = ['#667eea','#764ba2','#f093fb','#f5576c','#4facfe','#00f2fe','#43e97b','#38f9d7','#ff9a9e','#a18cd1','#667eea','#764ba2','#f093fb','#f5576c','#4facfe'];
        const top15 = [...filteredAccounts].sort((a, b) => (b.totalOrders || 0) - (a.totalOrders || 0)).slice(0, 15);
        charts.heatmap = new Chart(document.getElementById('heatmapChart'), {
            type: 'line',
            data: {
                labels: heatmapDates.map(d => d.slice(5).replace('-', '/')),
                datasets: top15.map((a, i) => ({
                    label: (a.account || '').substring(0, 6),
                    data: heatmapDates.map(d => a.daily ? (a.daily[d] || 0) : 0),
                    borderColor: colors[i % colors.length],
                    backgroundColor: 'transparent',
                    tension: 0.4
                }))
            },
            options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });
    }
    
    function populateFilters() {
        const operators = [...new Set(dashboardData.accounts.map(a => a.operator || ''))].filter(Boolean).sort();
        const types = [...new Set(dashboardData.accounts.map(a => a.accountType || ''))].filter(Boolean).sort();
        operators.forEach(op => {
            const opt = document.createElement('option'); opt.value = op; opt.textContent = op;
            document.getElementById('operatorFilter').appendChild(opt);
        });
        types.forEach(t => {
            const opt = document.createElement('option'); opt.value = t; opt.textContent = t;
            document.getElementById('typeFilter').appendChild(opt);
        });
    }
    
    function renderTable() {
        const dateHeaders = filteredDates.map(d => '<th>' + d.slice(5).replace('-', '/') + '</th>').join('');
        document.getElementById('tableHead').innerHTML = '<tr><th>#</th><th>璐﹀彿鍚嶇О</th><th>杩愯惀浜?/th><th>绫诲瀷</th><th>鎬昏鍗?/th><th>鎬绘敹鍏?/th><th>鏃ュ潎</th><th>瓒嬪娍</th>' + dateHeaders + '</tr>';
        renderTableRows(filteredAccounts);
    }
    
    function renderTableRows(accounts) {
        document.getElementById('tableBody').innerHTML = accounts.map((a, i) => {
            const dailyVals = filteredDates.map(d => a.daily ? (a.daily[d] || 0) : 0);
            const trendStr = dailyVals.join(' -> ');
            const cells = dailyVals.map(v => '<td class="orders ' + (v > 5 ? 'high' : v > 2 ? 'medium' : 'low') + '">' + v + '</td>').join('');
            return '<tr><td>' + (i + 1) + '</td><td class="account-name" title="' + a.account + '">' + a.account + '</td><td>' + (a.operator || '-') + '</td><td>' + (a.accountType || '-') + '</td><td class="total-orders">' + (a.totalOrders || 0).toLocaleString() + '</td><td>$' + Math.round(a.totalIncome || 0).toLocaleString() + '</td><td>' + (a.avgDaily || 0).toFixed(1) + '</td><td class="trend-cell" title="' + trendStr + '">' + trendStr + '</td>' + cells + '</tr>';
        }).join('');
        const totalOrders = accounts.reduce((s, a) => s + (a.totalOrders || 0), 0);
        document.getElementById('tableFooter').textContent = '鍏?' + accounts.length + ' 涓处鍙?| ' + totalOrders.toLocaleString() + ' 绗旇鍗?;
    }
    
    function filterTable() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const operator = document.getElementById('operatorFilter').value;
        const type = document.getElementById('typeFilter').value;
        const [field, dir] = document.getElementById('sortSelect').value.split('-');
        
        let filtered = filteredAccounts.filter(a => {
            const matchSearch = !search || (a.account || '').toLowerCase().includes(search);
            const matchOp = !operator || a.operator === operator;
            const matchType = !type || a.accountType === type;
            return matchSearch && matchOp && matchType;
        });
        
        // Sort
        if (field) {
            filtered.sort((a, b) => {
                let va, vb;
                if (field === 'totalOrders') { va = a.totalOrders || 0; vb = b.totalOrders || 0; }
                else if (field === 'totalIncome') { va = a.totalIncome || 0; vb = b.totalIncome || 0; }
                else if (field === 'account') { va = a.account || ''; vb = b.account || ''; return dir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va); }
                return dir === 'desc' ? vb - va : va - vb;
            });
        }
        
        renderTableRows(filtered);
    }
    
    function resetFilters() {
        document.getElementById('rangeSelect').value = '7';
        document.getElementById('searchInput').value = '';
        document.getElementById('operatorFilter').value = '';
        document.getElementById('typeFilter').value = '';
        document.getElementById('sortSelect').value = 'totalOrders-desc';
        changeRange();
    }
    
    init();
    </script>
</body>
</html>
