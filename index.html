<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .header p { opacity: 0.9; font-size: 14px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .stat-card .label { color: #666; font-size: 13px; margin-bottom: 8px; }
        .stat-card .value { font-size: 28px; font-weight: bold; color: #333; }
        .stat-card .sub { font-size: 12px; color: #999; margin-top: 5px; }
        .chart-container { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 25px; }
        .chart-title { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 15px; }
        .table-container { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow-x: auto; }
        .table-title { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #f8f9fa; padding: 12px 10px; text-align: left; font-weight: 600; color: #333; border-bottom: 2px solid #e9ecef; position: sticky; top: 0; white-space: nowrap; }
        td { padding: 10px; border-bottom: 1px solid #f0f0f0; color: #555; white-space: nowrap; }
        tr:hover { background: #f8f9fa; }
        .account-name { font-weight: 500; color: #333; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
        .orders { text-align: center; font-weight: 500; min-width: 50px; }
        .orders.high { color: #28a745; }
        .orders.low { color: #dc3545; }
        .orders.medium { color: #ffc107; }
        .total-orders { font-weight: bold; color: #667eea; }
        .filter-bar { margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .filter-bar input, .filter-bar select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }
        .filter-bar input { width: 200px; }
        .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        @media (max-width: 900px) { .charts-row { grid-template-columns: 1fr; } }
        .trend-cell { font-size: 11px; color: #999; max-width: 100px; overflow: hidden; text-overflow: ellipsis; }
        .footer { text-align: center; padding: 20px; color: #999; font-size: 12px; }
        .update-info { font-size: 12px; color: rgba(255,255,255,0.8); margin-top: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>[DATA] 抖音账号运营仪表盘</h1>

    <div class="stats" id="statsCards"></div>
    
    <div class="charts-row">

        <div class="filter-bar">

            </select>
            <select id="typeFilter" onchange="filterTable()">

            </select>
            <select id="sortSelect" onchange="sortTable()">

                <option value="account-asc">按账号名 A-Z</option>
            </select>
        </div>
        <table id="dataTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div id="tableFooter" style="padding:15px;text-align:center;color:#999;font-size:13px;"></div>
    </div>
    
    <div class="footer">
        <p>[FOOTER] 抖音账号运营仪表盘 | 数据来源：精选联盟订单数据</p>
    </div>

        const type = document.getElementById('typeFilter').value;
        const filtered = dashboardData.accounts.filter(a => {
            const matchSearch = !search || (a.account || '').toLowerCase().includes(search);
            const matchOp = !operator || a.operator === operator;
            const matchType = !type || a.accountType === type;
            return matchSearch && matchOp && matchType;
        });
        sortAndRender(filtered);
    }
    
    function sortTable() {
        const [field, dir] = document.getElementById('sortSelect').value.split('-');
        const filtered = dashboardData.accounts.filter(a => {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const operator = document.getElementById('operatorFilter').value;
            const type = document.getElementById('typeFilter').value;
            return (!search || (a.account || '').toLowerCase().includes(search)) && (!operator || a.operator === operator) && (!type || a.accountType === type);
        });
        sortAndRender(filtered, field, dir);
    }
    
    function sortAndRender(accounts, field, dir) {
        if (field && dir) {
            accounts.sort((a, b) => {
                let va, vb;
                if (field === 'totalOrders') { va = a.totalOrders || 0; vb = b.totalOrders || 0; }
                else if (field === 'totalIncome') { va = a.totalIncome || 0; vb = b.totalIncome || 0; }
                else if (field === 'account') { va = a.account || ''; vb = b.account || ''; return dir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va); }
                return dir === 'desc' ? vb - va : va - vb;
            });
        }
        renderTableRows(accounts);
    }
    
    init();
    </script>
</body>
</html>
