        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .header p { opacity: 0.9; font-size: 14px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .stat-card .label { color: #666; font-size: 13px; margin-bottom: 8px; }
        .stat-card .value { font-size: 28px; font-weight: bold; color: #333; }
        .stat-card .sub { font-size: 12px; color: #999; margin-top: 5px; }
        .chart-container { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 25px; }
        .chart-title { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 15px; }
        .table-container { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow-x: auto; }
        .table-title { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #f8f9fa; padding: 12px 10px; text-align: left; font-weight: 600; color: #333; border-bottom: 2px solid #e9ecef; position: sticky; top: 0; }
        td { padding: 10px; border-bottom: 1px solid #f0f0f0; color: #555; }
        tr:hover { background: #f8f9fa; }
        .account-name { font-weight: 500; color: #333; }
        .orders { text-align: center; font-weight: 500; }
        .orders.high { color: #28a745; }
        .orders.low { color: #dc3545; }
        .orders.medium { color: #ffc107; }
        .total-orders { font-weight: bold; color: #667eea; }
        .filter-bar { margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
        .filter-bar input, .filter-bar select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }
        .filter-bar input { width: 200px; }
        .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        @media (max-width: 900px) { .charts-row { grid-template-columns: 1fr; } }
        .trend-cell { font-size: 11px; color: #999; max-width: 80px; overflow: hidden; }
    </style>

    function init() {
        document.getElementById('accountCount').textContent = dashboardData.accounts.length;
        renderStats();
        renderCharts();
        renderTable();
        populateFilters();
    }
    
    function renderStats() {
        const totalOrders = dashboardData.accounts.reduce((s, a) => s + a.totalOrders, 0);
        const totalIncome = dashboardData.accounts.reduce((s, a) => s + a.totalIncome, 0);
        const avgDaily = totalOrders / dashboardData.accounts.length / dashboardData.dates.length;
        const top = dashboardData.accounts[0];
        document.getElementById('statsCards').innerHTML = `
            <div class="stat-card"><div class="label">7天总订单</div><div class="value">${totalOrders}</div><div class="sub">总商品销量</div></div>
            <div class="stat-card"><div class="label">7天总收入</div><div class="value">¥${totalIncome.toFixed(2)}</div><div class="sub">预估收入合计</div></div>
            <div class="stat-card"><div class="label">日均单量</div><div class="value">${avgDaily.toFixed(1)}</div><div class="sub">每账号每日平均</div></div>
            <div class="stat-card"><div class="label">TOP 1 账号</div><div class="value" style="font-size:20px">${top.totalOrders}</div><div class="sub">${top.account.replace('()', '')}</div></div>
        `;
    }
    
    function renderCharts() {
        const dailyTotals = {};
        dashboardData.dates.forEach(d => dailyTotals[d] = 0);
        dashboardData.accounts.forEach(a => { Object.entries(a.daily).forEach(([d, o]) => dailyTotals[d] += o); });
        
        new Chart(document.getElementById('dailyTrendChart'), {
            type: 'line',
            data: { labels: dashboardData.dates.map(d => d.slice(5).replace('-', '/')), datasets: [{ label: '每日订单', data: dashboardData.dates.map(d => dailyTotals[d]), borderColor: '#667eea', backgroundColor: 'rgba(102,126,234,0.1)', fill: true, tension: 0.4 }] },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });
        
        const top10 = dashboardData.accounts.slice(0, 10);
        new Chart(document.getElementById('top10Chart'), {
            type: 'bar',
            data: { labels: top10.map(a => a.account.replace('()', '').substring(0, 8)), datasets: [{ label: '7天总订单', data: top10.map(a => a.totalOrders), backgroundColor: ['#667eea','#764ba2','#f093fb','#f5576c','#4facfe','#00f2fe','#43e97b','#38f9d7','#ff9a9e','#a18cd1'] }] },
            options: { indexAxis: 'y', responsive: true }
        });
        
        const colors = ['#667eea','#764ba2','#f093fb','#f5576c','#4facfe','#00f2fe','#43e97b','#38f9d7','#ff9a9e','#a18cd1','#667eea','#764ba2','#f093fb','#f5576c','#4facfe'];
        const top15 = dashboardData.accounts.slice(0, 15);
        new Chart(document.getElementById('heatmapChart'), {
            type: 'line',
            data: { labels: dashboardData.dates.map(d => d.slice(5).replace('-', '/')), datasets: top15.map((a, i) => ({ label: a.account.replace('()', '').substring(0, 6), data: dashboardData.dates.map(d => a.daily[d] || 0), borderColor: colors[i % colors.length], backgroundColor: 'transparent', tension: 0.4 })) },
            options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });
    }
    
    function populateFilters() {
        const operators = [...new Set(dashboardData.accounts.map(a => a.operator))].filter(Boolean).sort();
        operators.forEach(op => { const opt = document.createElement('option'); opt.value = op; opt.textContent = op; document.getElementById('operatorFilter').appendChild(opt); });
    }
    
    function renderTable(data) {
        const accounts = data || dashboardData.accounts;
        document.getElementById('tableBody').innerHTML = accounts.map((a, i) => {
            const dailyVals = dashboardData.dates.map(d => a.daily[d] || 0);
            return `<tr>
                <td>${i + 1}</td>
                <td class="account-name">${a.account.replace('()', '')}</td>
                <td>${a.operator}</td>
                <td class="total-orders">${a.totalOrders}</td>
                <td>¥${a.totalIncome.toFixed(2)}</td>
                <td>${a.avgDaily}</td>
                <td class="trend-cell">${dailyVals.join(' → ')}</td>
                ${dailyVals.map(v => `<td class="orders ${v > 5 ? 'high' : v > 2 ? 'medium' : 'low'}">${v}</td>`).join('')}
            </tr>`;
        }).join('');
    }
    
    function filterTable() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const operator = document.getElementById('operatorFilter').value;
        const filtered = dashboardData.accounts.filter(a => a.account.toLowerCase().includes(search) && (!operator || a.operator === operator));
        renderTable(filtered);
    }
    
    function sortTable() {
        const [field, dir] = document.getElementById('sortSelect').value.split('-');
        const sorted = [...dashboardData.accounts].sort((a, b) => {
            const va = field === 'totalOrders' ? a.totalOrders : a.totalIncome;
            const vb = field === 'totalOrders' ? b.totalOrders : b.totalIncome;
            return dir === 'desc' ? vb - va : va - vb;
        });
        renderTable(sorted);
    }
    
    init();
    </script>
